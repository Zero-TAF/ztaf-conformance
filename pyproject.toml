[project]
name = "ztaf-conformance"
version = "0.1.0"
description = "Zero-TAF conformance reference: the must-fail fixture runner and the ztaf-audit engine (deployment bundle in, grade card out)."
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ztaf_conformance"]
